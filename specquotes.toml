# Spec-quote checks (greatspectations) — see AGENTS.md "Spec quotes".
# Run from the repo root with our experimental fork:
#   uvx --from /home/ubuntu/src/greatspectations greatspectate check \
#     --config specquotes.toml --comment-start "// " --comment-continue "//" \
#     --comment-aside "// Note:" crates/fips-identity/src/bech32.rs
[sources.bip]
format = "mediawiki"
dir = "specs"
pattern = "bip-{id:04d}.mediawiki"

# FIPS wire-format invariants (#176): verbatim quotes from the daemon
# implementation we interop with, vendored under specs/fips/ at the pinned
# Amperstrand/fips commit (recorded per file in specs/fips/*.pin — the same
# ref the CI daemon builds use, fork/main 0aef8ea2). mediawiki format =
# single section per file (rust has no '==' header lines), so any verbatim
# line matches.
[sources.fips-aead]
format = "mediawiki"
file = "specs/fips/noise-mod.rs"

[sources.fips-ecdh]
format = "mediawiki"
file = "specs/fips/noise-handshake.rs"

[sources.fips-fmp]
format = "mediawiki"
file = "specs/fips/fmp-wire.rs"

[sources.fips-ble]
format = "mediawiki"
file = "specs/fips/ble-mod.rs"

[sources.fips-fsp]
format = "mediawiki"
file = "specs/fips/fsp-wire.rs"

[sources.fips-mdns]
format = "mediawiki"
file = "specs/fips/mdns-mod.rs"

# FIPS XX-wire invariants (specquotes-XX): verbatim quotes from the FIPS
# `next` daemon we interop with on the XX/FMP-v1 wire, vendored under
# specs/fips-next/ at the pinned NEXT_REF e0cc0c86 (the same ref the
# xx-interop CI gate builds). Same mediawiki/stripped-comment convention
# as specs/fips/.
[sources.fips-xx-noise]
format = "mediawiki"
file = "specs/fips-next/noise-handshake.rs"

[sources.fips-xx-fmp]
format = "mediawiki"
file = "specs/fips-next/fmp-wire.rs"

[sources.fips-xx-active]
format = "mediawiki"
file = "specs/fips-next/peer-active.rs"

[sources.fips-xx-session]
format = "mediawiki"
file = "specs/fips-next/session-handlers.rs"
