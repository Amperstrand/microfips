[package]
name = "fips-fmp"
version = "0.1.0"
edition = "2021"
# MSRV = upstream fips's pinned toolchain (1.94.1 in its rust-toolchain.toml):
# these crates exist so fips can adopt them, so they must compile there. The
# rest of this workspace stays on Amperstrand house-current stable (1.99);
# CI job `msrv-portable-crates` enforces this floor.
rust-version = "1.94.1"
description = "FIPS Messaging Protocol — link-layer wire format and framing (no_std)"
license = "MIT"

[lib]
name = "fips_fmp"
path = "src/lib.rs"

[dependencies]
fips-noise = { path = "../fips-noise" }
fips-proto-defs = { git = "https://github.com/Amperstrand/fips-protocol-defs-mvp.git", rev = "2b606a8e7b2e78ebb91cf18b3e1a6d86c92bbe95" }
log = { version = "0.4", optional = true }

[features]
default = []
noise-xx = []
# std builds log the wire path; the optional dep must ride along (the
# `#[cfg(feature = "std")] log::debug!` call sites compiled without it before
# --all-features exposed the gap).
std = ["dep:log"]
