[package]
name = "microfips-esp32s3"
version = "0.1.0"
edition = "2021"
description = "Minimal FIPS leaf node on ESP32-S3"

[lib]
name = "microfips_esp32s3"

[features]
default = ["wifi"]
ble = ["dep:esp-radio", "dep:trouble-host", "dep:bt-hci", "dep:embedded-io", "dep:esp-println", "dep:log", "microfips-esp-transport/ble"]
l2cap = ["dep:esp-radio", "dep:trouble-host", "dep:bt-hci", "dep:embedded-io", "dep:esp-println", "dep:log", "microfips-esp-transport/l2cap"]
wifi = ["dep:esp-radio", "dep:esp-println", "dep:log", "dep:embassy-net", "microfips-esp-transport/wifi"]
mdns-open = ["wifi", "microfips-esp-transport/mdns-open"]
esp-now = ["dep:esp-radio", "dep:esp-println", "dep:log", "microfips-esp-transport/esp-now"]
relay-ap = ["wifi", "microfips-esp-transport/relay-ap"]
# Noise XX link handshake + FMP v1 wire (FIPS next / 1.0.0-dev, #179).
noise-xx = ["microfips-core/noise-xx", "microfips-protocol/noise-xx"]
# FIPS_LINK console wiretap — LEAKS link transport keys; bench builds only (#175).
noise-keylog = ["microfips-protocol/noise-keylog"]

[[bin]]
name = "microfips-esp32s3-uart"
path = "src/bin/uart.rs"

[[bin]]
name = "microfips-esp32s3-usb"
path = "src/bin/usb.rs"

[[bin]]
name = "microfips-esp32s3-ble"
path = "src/bin/ble.rs"
required-features = ["ble"]

[[bin]]
name = "microfips-esp32s3-l2cap"
path = "src/bin/l2cap.rs"
required-features = ["l2cap"]

[[bin]]
name = "microfips-esp32s3"
path = "src/bin/wifi.rs"
required-features = ["wifi"]

# Diagnostic spike: mDNS multicast TX/RX viability test (not a FIPS node)
[[bin]]
name = "microfips-esp32s3-mdns-spike"
path = "src/bin/mdns_spike.rs"
required-features = ["wifi"]

[[bin]]
name = "microfips-esp32s3-espnow"
path = "src/bin/espnow.rs"
required-features = ["esp-now"]

# ESP-NOW <-> USB-serial relay for the host-side serial_udp_bridge.py
[[bin]]
name = "microfips-esp32s3-espnow-gw"
path = "src/bin/espnow_gw.rs"
required-features = ["esp-now"]

# Standalone ESP-NOW <-> WiFi/UDP relay (no host, no serial bridge)
[[bin]]
name = "microfips-esp32s3-espnow-wifi-gw"
path = "src/bin/espnow_wifi_gw.rs"
required-features = ["esp-now", "wifi"]

# Hybrid node: direct WiFi/UDP when AP+daemon reachable, ESP-NOW otherwise
[[bin]]
name = "microfips-esp32s3-hybrid"
path = "src/bin/hybrid.rs"
required-features = ["esp-now", "wifi"]

# FIPS relay access point (Router/Extender by uplink config; not a node)
[[bin]]
name = "microfips-esp32s3-relay-ap"
path = "src/bin/relay_ap.rs"
required-features = ["relay-ap"]

# Relay AP that is also a FIPS peer (compiled-in identity, node over the uplink)
[[bin]]
name = "microfips-esp32s3-relay-ap-peer"
path = "src/bin/relay_ap_peer.rs"
required-features = ["relay-ap"]

[dependencies]
microfips-core = { path = "../microfips-core", features = ["log"] }
microfips-esp-common = { path = "../microfips-esp-common" }
microfips-esp-transport = { path = "../microfips-esp-transport", features = ["esp32s3"] }
microfips-http-demo = { path = "../microfips-http-demo" }
microfips-protocol = { path = "../microfips-protocol", features = ["log"] }
microfips-service = { path = "../microfips-service" }
rand_core = { workspace = true }
embassy-net = { workspace = true, features = ["dhcpv4", "udp", "multicast"], optional = true }
esp-hal = { workspace = true, features = ["esp32s3", "unstable"] }
esp-rtos = { workspace = true, features = ["esp32s3", "embassy", "esp-alloc", "esp-radio"] }
esp-bootloader-esp-idf = { workspace = true, features = ["esp32s3"] }
embassy-time = { workspace = true }
embassy-futures = { workspace = true }
embassy-executor = { workspace = true }
embassy-sync = { workspace = true }
embedded-io-async = { workspace = true }
heapless = { workspace = true }
static_cell = { workspace = true }
esp-radio = { workspace = true, features = ["esp32s3", "ble", "wifi", "unstable"], optional = true }
trouble-host = { workspace = true, features = ["default-packet-pool-mtu-255", "scan"], optional = true }
esp-alloc = { workspace = true }
bt-hci = { workspace = true, features = ["uuid"], optional = true }
embedded-io = { workspace = true, optional = true }
esp-println = { workspace = true, features = ["esp32s3", "jtag-serial"], optional = true }
log = { workspace = true, optional = true }

[build-dependencies]
microfips-build = { workspace = true }
