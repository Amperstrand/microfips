[package]
name = "microfips-link"
version = "0.1.0"
edition = "2021"
description = "FMP link integration test (host-side, std only)"

[[bin]]
name = "fips-handshake"
path = "src/main.rs"

[features]
# Noise XX (3-message) + FMP v1 negotiation — FIPS next wire compat.
# Same flag shape as the sim/firmware crates (#178/#179).
noise-xx = ["microfips-core/noise-xx"]

[dependencies]
microfips-core = { path = "../microfips-core", features = ["std"] }
k256 = { version = "0.13", features = ["arithmetic", "ecdsa", "ecdh", "std"] }
hex = "0.4"
rand = "0.9"
env_logger = "0.11"
log = "0.4"
