name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      chips:
        description: "Comma-separated chip filter for extended firmware builds (empty = all)"
        required: false
        default: ""
        type: string
      wifi-creds:
        description: "WiFi credentials for the built firmware: 'none' embeds nothing, 'secrets' uses WIFI_SSID/WIFI_PASSWORD repo secrets"
        required: false
        default: "none"
        type: choice
        options: [none, secrets]
  release:
    types: [published]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      # nextest for the protocol suites: per-test processes + slow-timeout
      # termination turn a hung test into a failure instead of a suite that
      # never reports (.config/nextest.toml sets the budgets).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - run: cargo test -p microfips-core

      # Run with --features std to include load_secret/load_peer_pub tests;
      # --test-threads=1 because env var tests modify process-global state.
      - run: cargo test -p microfips-core --features std -- --test-threads=1

      - run: cargo nextest run -p microfips-protocol --features std --test-threads=1
      - run: cargo nextest run -p microfips-protocol --features std,noise-xx --test-threads=1
      - run: cargo test -p microfips-service
      - run: cargo test -p microfips-l2cap-test
      - run: cargo test -p fips-noise
      - run: cargo test -p fips-noise --features noise-xx
      - run: cargo test -p fips-fmp
      - run: cargo test -p fips-identity
      # http-demo tests disabled: nightly SocketAddr::ToString regression
      # - run: cargo test -p microfips-http-demo --features http

  golden-vectors:
    name: Golden Vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Check FIPS golden vectors drift
        run: |
          # Reference vendored in-repo at specs/fips/golden_vectors.json
          # (#180): the Amperstrand/fips@golden-vectors branch (and the
          # fips-golden-gen generator) were deleted upstream 2026-08-31,
          # so our copy is the surviving reference. Hard gate — no
          # external fetch, nothing that can "unavailable-skip".
          echo "Comparing local vectors with the vendored reference..."
          LOCAL_HASH=$(sha256sum crates/microfips-core/tests/golden_vectors.json | cut -d ' ' -f1)
          FIPS_HASH=$(sha256sum specs/fips/golden_vectors.json | cut -d ' ' -f1)

          echo "Local hash:    $LOCAL_HASH"
          echo "Reference hash: $FIPS_HASH"

          if [ "$LOCAL_HASH" != "$FIPS_HASH" ]; then
            echo "::error::Golden vectors drift detected! The test-data copy and the vendored reference diverged."
            echo "If the change is deliberate (wire-crypto change against a moved fips pin), update BOTH copies and the pin note in specs/fips/golden_vectors.json.pin."
            exit 1
          fi

          echo "✓ Golden vectors match the vendored reference"

      - run: cargo test -p microfips-core --test golden_vectors

  noise-compliance:
    name: Noise Spec Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Count tests
        run: |
          CORE_COUNT=$(cargo test -p microfips-core --features std -- --list 2>&1 | grep -c "test$" || true)
          PROTO_COUNT=$(cargo test -p microfips-protocol --features std -- --list 2>&1 | grep -c "test$" || true)
          FSP_COUNT=$(cargo test -p microfips-core --features std --test fsp_over_fmp -- --list 2>&1 | grep -c "test$" || true)
          TOTAL=$((CORE_COUNT + FSP_COUNT))
          echo "Core tests: $CORE_COUNT (expect >= 160)"
          echo "Protocol tests: $PROTO_COUNT (expect >= 46)"
          echo "FSP integration tests: $FSP_COUNT (expect >= 5)"
          echo "Total core: $TOTAL (expect >= 166)"
          if [ "$CORE_COUNT" -lt 160 ]; then
            echo "::error::Core test count dropped below 160 (got $CORE_COUNT)"
            exit 1
          fi
          if [ "$PROTO_COUNT" -lt 46 ]; then
            echo "::error::Protocol test count dropped below 46 (got $PROTO_COUNT)"
            exit 1
          fi
          if [ "$FSP_COUNT" -lt 5 ]; then
            echo "::error::FSP integration test count dropped below 5 (got $FSP_COUNT)"
            exit 1
          fi

      - name: Verify FIPS-bug-compatible deviations are documented
        run: |
          NOISE_RS="crates/fips-noise/src/lib.rs"
          echo "Checking that Noise deviations are documented..."
          grep -q "FIPS: no AAD during handshake" "$NOISE_RS" || { echo "::error::Missing D1 documentation (empty AAD)"; exit 1; }
          grep -q "se_and_es_produce_different_keys" "$NOISE_RS" || { echo "::error::Missing D2 documentation (se DH swap)"; exit 1; }
          echo "D1 (empty AAD) and D2 (se DH swap) deviations are documented."

      - name: Run deviation-specific tests
        run: |
          cargo test -p microfips-core --features std -- se_and_es_produce_different_keys
          cargo test -p microfips-core --features std -- ik_se_uses_es_dh_inputs_intentionally
          cargo test -p microfips-core --features std -- fsp_session_full_flow
          cargo test -p microfips-core --features std --test fsp_over_fmp -- test_fsp_full_handshake_over_fmp

      - name: Run Noise IK transport key consistency (10 rounds)
        run: |
          for i in $(seq 1 10); do
            cargo test -p microfips-core --features std -- noise_ik_transport_keys_are_deterministic --quiet || { echo "::error::IK transport key test failed on round $i"; exit 1; }
          done
          echo "IK transport keys consistent across 10 rounds"

      - name: Run Noise XK transport key consistency (10 rounds)
        run: |
          for i in $(seq 1 10); do
            cargo test -p microfips-core --features std -- noise_xk_transport_keys_are_deterministic --quiet || { echo "::error::XK transport key test failed on round $i"; exit 1; }
          done
          echo "XK transport keys consistent across 10 rounds"

      - name: Check FSP handshake stability (10 rounds)
        run: |
          for i in $(seq 1 10); do
            cargo test -p microfips-core --features std --test fsp_over_fmp -- test_fsp_full_handshake_over_fmp --quiet || { echo "::error::FSP handshake test failed on round $i"; exit 1; }
          done
          echo "FSP full handshake stable across 10 rounds"

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true

      - name: Run audit
        run: cargo audit --ignore RUSTSEC-2026-0173 --ignore RUSTSEC-2026-0097

  build-host:
    name: Build Host Tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo build -p microfips-link --release
      - run: cargo build -p microfips-sim --release
      - run: cargo build -p microfips-http-test --release
      # http-demo build disabled: nightly SocketAddr::ToString regression
      # - run: cargo build -p microfips-http-demo --features http --release

      - name: Clone and build FIPS daemon
        env:
          # Pinned to a revision known protocol-compatible with this repo.
          # Update deliberately when microfips adopts newer FIPS protocol
          # changes — otherwise a moving upstream master breaks this job
          # for unrelated PRs.
          # 2026-08-31: repinned from cbc3b71 (vanished in the fips-side
          # history cleanup, cf. #180) to fork/main HEAD 0aef8ea2 — same
          # v0.5.0 wire, builds clean, and is what the local lab daemon
          # runs.
          FIPS_REF: 0aef8ea2a2bc8b8ca80f78c23cea956c36c5d535
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-dev pkg-config
          git clone https://github.com/Amperstrand/fips.git /tmp/fips
          git -C /tmp/fips checkout "$FIPS_REF"
          cargo build --release --manifest-path /tmp/fips/Cargo.toml --bin fips

      - uses: actions/upload-artifact@v4
        with:
          name: fips-handshake
          path: target/release/fips-handshake
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: microfips-sim
          path: target/release/microfips-sim
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: fips-daemon
          path: /tmp/fips/target/release/fips
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: microfips-http-test
          path: target/release/microfips-http-test
          retention-days: 7

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -p microfips-core -p microfips-protocol -p microfips-service -p microfips-link -p microfips-sim -p microfips-http-test -p fips-decrypt -p microfips-l2cap-test -p microfips-build -p microfips-esp-common -p microfips-esp-transport -p microfips-http-demo -p fips-noise -p fips-fmp -p fips-identity -- --check

      - name: Run clippy
        # ESP crates (esp-common, esp-transport) require ESP toolchain — omit from host lint
        run: cargo clippy -p microfips-core -p microfips-protocol -p microfips-service -p microfips-link -p microfips-sim -p microfips-http-test -p fips-decrypt -p microfips-l2cap-test -p microfips-build -p microfips-http-demo -p fips-noise -p fips-fmp -p fips-identity -- -D warnings

  sim-smoke:
    name: Simulator Smoke Test
    runs-on: ubuntu-latest
    needs: [build-host]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: microfips-sim
          path: ./bin

      - run: chmod +x ./bin/microfips-sim

      - name: Verify simulator starts and exits cleanly on EOF
        timeout-minutes: 1
        run: |
          timeout 5 ./bin/microfips-sim </dev/null 2>&1 | head -5
          echo "sim exited with code $?"

  fips-integration:
    name: FIPS Handshake Integration
    runs-on: ubuntu-latest
    needs: [build-host]
    env:
      FIPS_ADDR: orangeclaw.dns4sats.xyz:2121
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: fips-handshake
          path: ./bin

      - uses: actions/download-artifact@v4
        with:
          name: microfips-http-test
          path: ./bin

      - uses: actions/download-artifact@v4
        with:
          name: fips-daemon
          path: ./bin

      - uses: actions/download-artifact@v4
        with:
          name: microfips-sim
          path: ./bin

      - run: chmod +x ./bin/fips-handshake ./bin/microfips-http-test ./bin/fips ./bin/microfips-sim

      - name: Generate fresh key pairs
        run: |
          echo "--- Generating node (responder) key pair ---"
          NODE_KEYS=$(./bin/fips-handshake --keygen)
          echo "$NODE_KEYS"
          echo "NODE_SECRET=$(echo "$NODE_KEYS" | sed -n 's/^FIPS_NSEC=//p')" >> "$GITHUB_ENV"
          echo "NODE_PUB=$(echo "$NODE_KEYS" | sed -n 's/^FIPS_PUB=//p')" >> "$GITHUB_ENV"

          echo "--- Generating leaf (initiator) key pair ---"
          LEAF_KEYS=$(./bin/fips-handshake --keygen)
          echo "$LEAF_KEYS"
          echo "LEAF_SECRET=$(echo "$LEAF_KEYS" | sed -n 's/^FIPS_NSEC=//p')" >> "$GITHUB_ENV"
          echo "LEAF_PUB=$(echo "$LEAF_KEYS" | sed -n 's/^FIPS_PUB=//p')" >> "$GITHUB_ENV"

      - name: Start FIPS responder
        run: |
          echo "Starting responder with node key..."
          FIPS_NSEC="$NODE_SECRET" FIPS_PEER_NPUB="$LEAF_PUB" ./bin/microfips-http-test 127.0.0.1:31338 &
          echo $! > /tmp/responder.pid
          sleep 1
          echo "Responder running (pid $(cat /tmp/responder.pid))"

      - name: "Test 1: Leaf → local node handshake (fresh keys)"
        timeout-minutes: 1
        run: |
          echo "=== Leaf → Node handshake (fresh keys, localhost) ==="
          FIPS_NSEC="$LEAF_SECRET" FIPS_PEER_NPUB="$NODE_PUB" \
            ./bin/fips-handshake 127.0.0.1:31338
          echo "=== LOCAL HANDSHAKE SUCCEEDED ==="

      - name: Stop local responder
        if: always()
        run: |
          if [ -f /tmp/responder.pid ]; then
            kill "$(cat /tmp/responder.pid)" 2>/dev/null || true
          fi

      - name: "Test 2: Leaf → public FIPS node (explicit keys)"
        timeout-minutes: 1
        continue-on-error: true
        run: |
          STM32_NSEC=$(python3 - <<'PY'
          import json
          with open('device-registry.json') as f:
              reg = json.load(f)
          # Test identities are derived, not stored (issue #134): nsec = generator_mul
          # as 32-byte big-endian.
          print(format(reg['devices']['stm32']['vector_key']['generator_mul'], '064x'))
          PY
          )
          VPS_NPUB=$(python3 - <<'PY'
          import json
          with open('device-registry.json') as f:
              reg = json.load(f)
          print(reg['devices']['vps']['npub_hex'])
          PY
          )
          echo "=== Leaf → public FIPS node ==="
          echo "Using derived STM32 identity and VPS peer pubkey from device-registry.json"
          FIPS_NSEC="$STM32_NSEC" FIPS_PEER_NPUB="$VPS_NPUB" ./bin/fips-handshake "$FIPS_ADDR" 2>&1 || true
          echo "=== (continue-on-error: VPS may be unreachable from CI) ==="

      - name: "Test 3: sim↔daemon rekey soak (steady state survives rekey)"
        timeout-minutes: 5
        run: |
          set -euo pipefail
          echo "=== Rekey soak: sim leaf vs local daemon (rekey.after_secs=20) ==="
          # Fresh identity for the soak daemon (never reuse test identities).
          SOAK_KEYS=$(./bin/fips-handshake --keygen)
          SOAK_DAEMON_NSEC=$(echo "$SOAK_KEYS" | sed -n 's/^FIPS_NSEC=//p')
          SOAK_DAEMON_NPUB=$(echo "$SOAK_KEYS" | sed -n 's/^FIPS_PUB=//p')
          SOAK_LEAF_KEYS=$(./bin/fips-handshake --keygen)
          SOAK_LEAF_NSEC=$(echo "$SOAK_LEAF_KEYS" | sed -n 's/^FIPS_NSEC=//p')

          printf '%s\n' \
            'node:' \
            '  identity:' \
            "    nsec: ${SOAK_DAEMON_NSEC}" \
            '    persistent: false' \
            '  log_level: debug' \
            '  rekey:' \
            '    after_secs: 20' \
            'transports:' \
            '  udp:' \
            '    bind_addr: "127.0.0.1:21214"' \
            'control:' \
            '  socket_path: "/tmp/rekey-soak-control.sock"' \
            'tun:' \
            '  enabled: false' \
            'dns:' \
            '  enabled: false' \
            > /tmp/rekey-soak-daemon.yaml

          ./bin/fips --config /tmp/rekey-soak-daemon.yaml > /tmp/rekey-soak-daemon.log 2>&1 &
          echo $! > /tmp/rekey-soak-daemon.pid
          for i in $(seq 1 20); do
            grep -q "UDP transport started" /tmp/rekey-soak-daemon.log && break
            sleep 1
          done
          grep -q "UDP transport started" /tmp/rekey-soak-daemon.log || {
            echo "::error::soak daemon did not start"; tail -20 /tmp/rekey-soak-daemon.log; exit 1; }

          FIPS_NSEC="$SOAK_LEAF_NSEC" FIPS_PEER_NPUB="$SOAK_DAEMON_NPUB" \
            timeout 80 ./bin/microfips-sim --udp 127.0.0.1:21214 > /tmp/rekey-soak-sim.log 2>&1 &
          echo $! > /tmp/rekey-soak-sim.pid

          # Rekey fires at ~20s ± 15s jitter; 75s covers >= 1-2 full cycles.
          sleep 75

          DISCONNECTS=$(grep -c "disconnect notification" /tmp/rekey-soak-daemon.log || true)
          PROMOTED=$(grep -c "Connection promoted to active peer" /tmp/rekey-soak-daemon.log || true)
          REKEY_CUTOVERS=$(grep -c "Rekey cutover complete" /tmp/rekey-soak-daemon.log || true)
          SIM_PID=$(cat /tmp/rekey-soak-sim.pid)
          SIM_ALIVE=$(kill -0 "$SIM_PID" 2>/dev/null && echo yes || echo no)

          echo "soak verdict: promoted=$PROMOTED cutovers=$REKEY_CUTOVERS disconnects=$DISCONNECTS sim_alive=$SIM_ALIVE"
          tail -5 /tmp/rekey-soak-sim.log || true

          kill "$SIM_PID" "$(cat /tmp/rekey-soak-daemon.pid)" 2>/dev/null || true

          [ "$PROMOTED" -ge 1 ] || { echo "::error::sim never handshook the daemon"; exit 1; }
          [ "$REKEY_CUTOVERS" -ge 1 ] || { echo "::error::daemon rekeyed but no cutover completed — leaf did not follow"; cat /tmp/rekey-soak-daemon.log | grep -i rekey | tail -10; exit 1; }
          [ "$DISCONNECTS" -eq 0 ] || { echo "::error::disconnects during rekey window — the pre-#183 failure signature"; exit 1; }
          [ "$SIM_ALIVE" = "yes" ] || { echo "::error::sim died during the soak"; exit 1; }
          echo "=== REKEY SOAK PASSED ==="

  build-firmware:
    name: Build Firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: thumbv7em-none-eabi
          components: rust-src

      - uses: Swatinem/rust-cache@v2

      - name: Install ARM tools
        run: sudo apt-get update -qq && sudo apt-get install -yqq gcc-arm-none-eabi

      - run: cargo build -p microfips --release --target thumbv7em-none-eabi

      # Display build (#113): guards against BSP API drift invisible to the other two builds.
      - run: cargo build -p microfips --release --target thumbv7em-none-eabi --features display

      - run: cargo build -p microfips --release --target thumbv7em-none-eabi --no-default-features --features board-f746
      - run: cargo build -p microfips --release --target thumbv7em-none-eabi --features noise-xx

      - name: Validate firmware binary
        run: |
          BINARY="target/thumbv7em-none-eabi/release/microfips"
          ELF_SIZE=$(stat -c%s "$BINARY")
          TEXT_SIZE=$(arm-none-eabi-size "$BINARY" | tail -1 | awk '{print $1}')
          echo "ELF size: $ELF_SIZE bytes ($(($ELF_SIZE / 1024)) KB)"
          echo ".text size: $TEXT_SIZE bytes"
          if [ "$TEXT_SIZE" -lt 10000 ]; then
            echo "::error::Firmware .text is only ${TEXT_SIZE}B — linker script not applied"
            exit 1
          fi
          if [ "$TEXT_SIZE" -gt 200000 ]; then
            echo "::warning::Firmware .text is ${TEXT_SIZE}B — unexpectedly large"
          fi
        id: size

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-elf
          path: target/thumbv7em-none-eabi/release/microfips
          retention-days: 7

  spec-quotes:
    # Pinned verbatim spec quotes in source comments, validated against
    # vendored spec documents by our experimental greatspectations fork
    # (Amperstrand/greatspectations, branch ai-experimental-slop).
    name: Spec Quotes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install greatspectations (experimental fork)
        run: pip install "git+https://github.com/Amperstrand/greatspectations@ai-experimental-slop"

      - name: Check pinned spec quotes
        run: |
          greatspectate check --config specquotes.toml \
            --comment-start "// " --comment-continue "//" \
            --comment-aside "// Note:" \
            $(git ls-files '*.rs')

  build-esp32:
    name: Build ESP32 Firmware
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Xtensa toolchain
        uses: esp-rs/xtensa-toolchain@v1.6
        with:
          default: true
          buildtargets: esp32,esp32s3,esp32c3
          ldproxy: false

      - uses: Swatinem/rust-cache@v2
        with:
          key: esp32

      - name: Build ESP32 UART
        run: cargo +esp build -p microfips-esp32 --release --target xtensa-esp32-none-elf -Zbuild-std=core,alloc

      - name: Build ESP32 BLE
        run: cargo +esp build -p microfips-esp32 --release --target xtensa-esp32-none-elf -Zbuild-std=core,alloc --features ble

      - name: Build ESP32 L2CAP
        run: cargo +esp build -p microfips-esp32 --release --target xtensa-esp32-none-elf -Zbuild-std=core,alloc --features l2cap

      - name: Build ESP32 WiFi
        run: WIFI_SSID=ci WIFI_PASSWORD=ci cargo +esp build -p microfips-esp32 --release --target xtensa-esp32-none-elf -Zbuild-std=core,alloc --features wifi

      - name: Build ESP32 L2CAP + Noise XX (FMP v1)
        run: cargo +esp build -p microfips-esp32 --release --target xtensa-esp32-none-elf -Zbuild-std=core,alloc --features l2cap,noise-xx

      - name: Build ESP32-S3 WiFi
        run: WIFI_SSID=ci WIFI_PASSWORD=ci cargo +esp build -p microfips-esp32s3 --release --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc

      - name: Build ESP32-S3 WiFi + Noise XX (FMP v1)
        run: WIFI_SSID=ci WIFI_PASSWORD=ci cargo +esp build -p microfips-esp32s3 --release --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc --features noise-xx

      # #206: push-path compile guard for the four S3 esp-now binaries —
      # espnow-wifi-gw bit-rotted silently from the #184 DNS refactor to
      # 62954b5 because no CI job built it (the extended matrix only runs
      # on release/workflow_dispatch). One invocation shares the dep
      # compilation across all four bins.
      - name: Build ESP32-S3 ESP-NOW (node, gw, wifi-gw, hybrid)
        run: >
          WIFI_SSID=ci WIFI_PASSWORD=ci cargo +esp build -p microfips-esp32s3
          --release --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc
          --no-default-features --features esp-now,wifi
          --bin microfips-esp32s3-espnow --bin microfips-esp32s3-espnow-gw
          --bin microfips-esp32s3-espnow-wifi-gw --bin microfips-esp32s3-hybrid

      # ESP32-C3 has no compiled-in identity (issue #134: RETRIEVE_FROM_BUILD) —
      # inject a throwaway scalar so the env! const resolves. Compile-only check.
      - name: Build ESP32-C3 UART
        run: DEVICE_NSEC_HEX_esp32c3=$(openssl rand -hex 32) cargo +esp build -p microfips-esp32c3 --release --target riscv32imc-unknown-none-elf -Zbuild-std=core,alloc --no-default-features

      - name: Build ESP32-C3 WiFi
        run: DEVICE_NSEC_HEX_esp32c3=$(openssl rand -hex 32) WIFI_SSID=ci WIFI_PASSWORD=ci cargo +esp build -p microfips-esp32c3 --release --target riscv32imc-unknown-none-elf -Zbuild-std=core,alloc --features wifi

  build-firmware-extended:
    # Full variant matrix (esp-now, hybrid, relay-ap, mdns-open, gateways).
    # Deliberately NOT run on push/PR — the esp toolchain is slow and these
    # binaries are only needed for releases and bench flashing. Run manually
    # (Actions tab → CI → Run workflow) or on every release publish.
    name: Extended Firmware (${{ matrix.bin }})
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # classic ESP32 (D0WD/PICO/WROVER class — CYD, M5 Atom, LilyGo)
          - { chip: esp32, target: xtensa-esp32-none-elf, package: microfips-esp32, features: "esp-now", bin: microfips-esp32-espnow }
          - { chip: esp32, target: xtensa-esp32-none-elf, package: microfips-esp32, features: "esp-now,wifi", bin: microfips-esp32-espnow-wifi-gw }
          - { chip: esp32, target: xtensa-esp32-none-elf, package: microfips-esp32, features: "mdns-open", bin: microfips-esp32-wifi }
          # ESP32-S3 (Walter, TiLDAGON, generic S3 boards)
          - { chip: esp32s3, target: xtensa-esp32s3-none-elf, package: microfips-esp32s3, features: "esp-now", bin: microfips-esp32s3-espnow }
          - { chip: esp32s3, target: xtensa-esp32s3-none-elf, package: microfips-esp32s3, features: "esp-now", bin: microfips-esp32s3-espnow-gw }
          - { chip: esp32s3, target: xtensa-esp32s3-none-elf, package: microfips-esp32s3, features: "esp-now", bin: microfips-esp32s3-espnow-wifi-gw }
          - { chip: esp32s3, target: xtensa-esp32s3-none-elf, package: microfips-esp32s3, features: "esp-now", bin: microfips-esp32s3-hybrid }
          - { chip: esp32s3, target: xtensa-esp32s3-none-elf, package: microfips-esp32s3, features: "relay-ap", bin: microfips-esp32s3-relay-ap }
          - { chip: esp32s3, target: xtensa-esp32s3-none-elf, package: microfips-esp32s3, features: "relay-ap", bin: microfips-esp32s3-relay-ap-peer }
          - { chip: esp32s3, target: xtensa-esp32s3-none-elf, package: microfips-esp32s3, features: "wifi", bin: microfips-esp32s3-mdns-spike }
    steps:
      - uses: actions/checkout@v4

      - name: Filter chips (manual runs)
        id: chipfilter
        run: |
          if [ -n "${{ inputs.chips }}" ] && [ -n "${{ matrix.chip }}" ]; then
            case ",${{ inputs.chips }}," in
              *",${{ matrix.chip }},"*) echo "keep=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "keep=false" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo "keep=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Xtensa toolchain
        if: steps.chipfilter.outputs.keep == 'true'
        uses: esp-rs/xtensa-toolchain@v1.6
        with:
          default: true
          buildtargets: esp32,esp32s3
          ldproxy: false

      - uses: Swatinem/rust-cache@v2
        if: steps.chipfilter.outputs.keep == 'true'
        with:
          key: esp-extended

      # rust-src ships preinstalled in the espup/xtensa toolchain dist;
      # `rustup component add` against the custom 'esp' toolchain fails on
      # current rustup ("does not support components") and is unnecessary.

      # Credential policy: release/dispatch default embeds NO credentials
      # (empty SSID/password = open-network auth mode) so published firmware
      # artifacts can never leak real WiFi passwords. 'secrets' mode (manual
      # dispatch only) injects WIFI_SSID/WIFI_PASSWORD from repo secrets for
      # internal bench builds — those artifacts must then be treated as
      # containing credentials.
      - name: Build ${{ matrix.bin }}
        if: steps.chipfilter.outputs.keep == 'true'
        env:
          WIFI_SSID: ${{ (github.event_name == 'workflow_dispatch' && inputs.wifi-creds == 'secrets') && secrets.WIFI_SSID || '' }}
          WIFI_PASSWORD: ${{ (github.event_name == 'workflow_dispatch' && inputs.wifi-creds == 'secrets') && secrets.WIFI_PASSWORD || '' }}
        run: |
          cargo +esp build -p ${{ matrix.package }} --release --target ${{ matrix.target }} \
            -Zbuild-std=core,alloc --features ${{ matrix.features }} --bin ${{ matrix.bin }}

      - uses: actions/upload-artifact@v4
        if: steps.chipfilter.outputs.keep == 'true'
        with:
          name: firmware-${{ matrix.bin }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          retention-days: ${{ github.event_name == 'release' && 90 || 14 }}

  sim-ping:
    name: Sim-to-Sim Ping via FIPS (on-demand VM)
    # Secret-safe gating: this job executes repo scripts with SHC_API_KEY and
    # provisions paid VMs. pull_request events (especially from forks) must
    # never reach it — PR-controlled code could otherwise read the key. The
    # test runs on branch pushes and manual dispatches instead.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [build-host]
    timeout-minutes: 15
    env:
      SHC_API_KEY: ${{ secrets.SHC_API_KEY }}
      SHC_API_IP: ${{ secrets.SHC_API_IP }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: microfips-sim
          path: ./bin

      - uses: actions/download-artifact@v4
        with:
          name: fips-daemon
          path: ./bin

      - run: chmod +x ./bin/microfips-sim ./bin/fips

      - name: Provision VM and deploy FIPS
        id: provision
        run: |
          if ! getent hosts blesta.sovereignhybridcompute.com >/dev/null 2>&1 && [ -z "${{ secrets.SHC_API_IP }}" ]; then
            echo "::notice::SHC API unresolvable (their DNS outage) and no SHC_API_IP pin — skipping sim-ping; not a code failure"
            exit 0
          fi
          python3 scripts/ci_sim_ping.py provision --github-output

      - name: Run sim-to-sim ping test
        if: steps.provision.outputs.vm_ip != ''
        env:
          VM_IP: ${{ steps.provision.outputs.vm_ip }}
          FIPS_NPUB: ${{ steps.provision.outputs.fips_npub_hex }}
        run: |
          set -e
          FIPS_ADDR="$VM_IP:2121"

          FIPS_PEER_NPUB="$FIPS_NPUB" ./bin/microfips-sim --udp "$FIPS_ADDR" --sim-a > /tmp/sim-a.log 2>&1 &
          SIMA_PID=$!
          sleep 8

          if ! kill -0 $SIMA_PID 2>/dev/null; then
            echo "::error::SIM-A crashed before SIM-B started"
            grep -E "(error|FAIL|ERR)" /tmp/sim-a.log || true
            exit 1
          fi
          echo "SIM-A connected"

          FIPS_PEER_NPUB="$FIPS_NPUB" timeout 90 ./bin/microfips-sim --udp "$FIPS_ADDR" --sim-b --test-ping > /tmp/sim-b.log 2>&1 &
          SIMB_PID=$!

          wait $SIMB_PID 2>/dev/null
          EXIT=$?

          echo "=== SIM-B trace ==="
          grep -E "(MSG1|MSG2|handshake|ACK|PONG|PING|FAIL|error)" /tmp/sim-b.log || true

          echo "=== SIM-A trace ==="
          grep -E "(LEAF|sending|ACK|PONG|PING|FAIL|error)" /tmp/sim-a.log || true

          kill $SIMA_PID 2>/dev/null || true

          if [ "$EXIT" -eq 0 ]; then
            echo "=== PASS: PING/PONG round-trip confirmed via FIPS ==="
          else
            echo "::error::FAIL: SIM-B did not receive PONG (exit=$EXIT)"
            exit 1
          fi

      - name: Cleanup VM
        if: always()
        env:
          SERVICE_ID: ${{ steps.provision.outputs.service_id }}
        run: |
          if [ -n "$SERVICE_ID" ]; then
            python3 scripts/ci_sim_ping.py cleanup --service-id "$SERVICE_ID" || true
          fi
          kill $(pgrep -f microfips-sim) 2>/dev/null || true

  publish-evidence:
    name: Publish Test Evidence
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Run cargo test with JSON output
        run: |
          mkdir -p test-results
          {
            cargo test --message-format=json -p microfips-core 2>&1 || true
            cargo test --message-format=json -p microfips-core --features std -- --test-threads=1 2>&1 || true
            cargo test --message-format=json -p microfips-protocol --features std -- --test-threads=1 2>&1 || true
            cargo test --message-format=json -p microfips-service 2>&1 || true
            cargo test --message-format=json -p microfips-l2cap-test 2>&1 || true
          } > test-results/cargo-results.json

      - name: Generate summary.json
        run: python3 scripts/generate-summary.py test-results/cargo-results.json -o test-results/summary.json

      - name: Install nak CLI
        run: |
          NAK_URL=$(curl -sL https://api.github.com/repos/fiatjaf/nak/releases/latest \
            | python3 -c "import json,sys; print([a['browser_download_url'] for a in json.load(sys.stdin)['assets'] if 'linux-amd64' in a['name']][0])")
          curl -sL "$NAK_URL" -o /usr/local/bin/nak
          chmod +x /usr/local/bin/nak
          nak --version || true

      - name: Install nostr-publish
        run: pip install git+https://github.com/Amperstrand/nostr-publish-file-metadata-action.git

      - name: Publish test evidence to Blossom + Nostr
        env:
          PROJECT_TAG: microfips
          PUBLISH_NSEC: ${{ secrets.PUBLISH_NSEC }}
        run: |
          if [ -z "$PUBLISH_NSEC" ]; then
            echo "PUBLISH_NSEC secret not set — skipping publish"
            exit 0
          fi
          printf '%s' "$PUBLISH_NSEC" > /tmp/nsec
          # Extract counts for nostr-publish metadata
          PASSED=$(python3 -c "import json; d=json.load(open('test-results/summary.json')); print(d['counts']['passed'])")
          FAILED=$(python3 -c "import json; d=json.load(open('test-results/summary.json')); print(d['counts']['failed'])")
          SKIPPED=$(python3 -c "import json; d=json.load(open('test-results/summary.json')); print(d['counts']['skipped'])")
          nostr-publish test-results/ \
            --nsec-file /tmp/nsec \
            --blossom-server https://blossom.psbt.me \
            --relays wss://relay.cashu.email,wss://relay.damus.io,wss://nos.lol \
            --branch "${{ github.ref_name }}" \
            --commit "${{ github.sha }}" \
            --passed "$PASSED" \
            --failed "$FAILED" \
            --skipped "$SKIPPED" \
            || true
          rm -f /tmp/nsec

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test, golden-vectors, build-host, lint, sim-smoke, sim-ping, build-firmware, build-esp32, fips-integration, spec-quotes]
    if: always()
    steps:
      - run: |
          echo "# CI Pipeline Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Unit Tests | \`${{ needs.test.result }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Golden Vectors | \`${{ needs.golden-vectors.result }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build Host Tools | \`${{ needs.build-host.result }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint & Format | \`${{ needs.lint.result }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Simulator Smoke | \`${{ needs.sim-smoke.result }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Sim-to-Sim Ping | \`${{ needs.sim-ping.result }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build Firmware | \`${{ needs.build-firmware.result }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build ESP32 | \`${{ needs.build-esp32.result }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| FIPS Integration | \`${{ needs.fips-integration.result }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Spec Quotes | \`${{ needs.spec-quotes.result }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
