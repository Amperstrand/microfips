# Gitleaks allowlist — every entry justified.
title = "microfips gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Golden vector files: deterministic noise/crypto test vectors (scalar 0x11/0xaa-class seeds, published handshake bytes) — the regression contract by design"
paths = [
  '''crates/microfips-core/tests/golden_vectors\.json''',
  '''specs/fips/golden_vectors\.json''',
]

[[allowlists]]
description = "keys.json exists only in history: committed device key literals retired in 190a81f (issue #134 Tier 1) in favor of a public-only device-registry.json; devices re-keyed as part of that retirement"
paths = [
  '''keys\.json''',
]

[[allowlists]]
description = "README/architecture docs and the BLE pipeline smoke script document lab_keygen demo keypairs (published test seeds, e.g. 0011..EEFF class)"
paths = [
  '''README\.md''',
  '''docs/architecture\.md''',
  '''tools/test-ble-pipeline\.sh''',
]

[[allowlists]]
description = "Strategy-doc prose names the secp256k1-sys crate on the xtensa arch; the generic-api-key heuristic reads 'API drift, secp256k1-sys-on-xtensa' as key:value — the captured 'secret' is a crate name, never a credential (historical commit ebf1bb8, triaged in issue #245; match-scoped so the detector stays live on that file)"
regexTarget = "match"
regexes = [
  '''secp256k1-sys-on-xtensa''',
]
